name: Juego (pruebas y exportación)

on:
  push:
    paths:
      - "siete-vidas/juego/**"
      - ".github/workflows/juego.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  pruebas-y-exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot y plantillas de exportación
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz "templates/linux_release.x86_64" "templates/windows_release_x86_64.exe" "templates/web_nothreads_release.zip" "templates/version.txt"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Importar el proyecto
        run: godot --headless --path siete-vidas/juego --import

      - name: Pruebas de movimiento
        run: godot --headless --path siete-vidas/juego --script res://pruebas/prueba_movimiento.gd

      - name: Pruebas del escenario
        run: godot --headless --path siete-vidas/juego --script res://pruebas/prueba_escenario.gd

      - name: Pruebas de mecánicas
        run: godot --headless --path siete-vidas/juego --script res://pruebas/prueba_mecanicas.gd

      - name: Prueba del primer nivel (tutorial)
        run: godot --headless --path siete-vidas/juego --script res://pruebas/prueba_nivel.gd

      - name: Reglas de diseño de niveles (R1–R19, arte contra colisión, puertas medidas)
        run: godot --headless --path siete-vidas/juego --script res://pruebas/prueba_reglas_nivel.gd

      - name: Pelea con A.S.P.I.
        run: godot --headless --path siete-vidas/juego --script res://pruebas/prueba_jefe.gd

      - name: Acciones de Felipe y sistemas del nivel (agenda, diálogo, indicador, rascador)
        run: godot --headless --path siete-vidas/juego --script res://pruebas/prueba_acciones.gd

      - name: Partida completa (un bot termina el nivel 1 sin doble salto, Zoomies ni trepar)
        run: godot --headless --path siete-vidas/juego --fixed-fps 60 --script res://pruebas/partida.gd

      - name: Exportar Windows, Linux y Web
        run: |
          mkdir -p build/windows build/linux build/web
          godot --headless --path siete-vidas/juego --export-release "Windows"
          godot --headless --path siete-vidas/juego --export-release "Linux"
          godot --headless --path siete-vidas/juego --export-release "Web"
          ls -la build/windows build/linux build/web

      - name: Subir Windows
        uses: actions/upload-artifact@v4
        with:
          name: FelipeSieteVidas-Windows
          path: build/windows/

      - name: Subir Linux
        uses: actions/upload-artifact@v4
        with:
          name: FelipeSieteVidas-Linux
          path: build/linux/

      - name: Subir Web
        uses: actions/upload-artifact@v4
        with:
          name: FelipeSieteVidas-Web
          path: build/web/
